name: Dev CI (lint, format, test)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Rust linting / formatting.
  cargo-fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - name: Format check
        run: just fmt-check

  cargo-clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: just lint

  cargo-udeps:
    name: cargo udeps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-04
      - name: Install cargo udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Udeps release
        run: just udeps

  # Tests
  # Rust tests for supported platforms.
  test-rust:
    # Preserve the required check names while the version comes from rust-toolchain.toml.
    name: test-rust (${{ matrix.build }}, ${{ matrix.os }}, stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable
            os: ubuntu-latest
          - build: macos
            os: macos-latest
          - build: win
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # need this for integration tests
          fetch-depth: 0
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Basic build
        run: just build
      - name: Unit and offline tests
        if: runner.os != 'Linux'
        run: just test
      - name: Tests including live GitHub API
        if: runner.os == 'Linux'
        run: just test-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: debug
